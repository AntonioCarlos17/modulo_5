    <title>Flex box</title>
    <style>
        /* 

        fex direction: row;
        main-axis é o eixo principal na horizontal
        main-start inicio
        main-end final

        cross-axis é o eixo principal na vertical
        cross-start inicio
        cross-end final
        */
        div.container_1{
            background-color: aquamarine;
            display: flex;
            flex-flow: row wrap;
            align-content: flex-start;
            height: 400px;
        }

         div.container_7{

            flex-flow: row wrap;
            align-content: space-around;
