<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        /* 

        fex direction: row;
        main-axis é o eixo principal na horizontal
        main-start inicio
        main-end final

        cross-axis é o eixo principal na vertical
        cross-start inicio
        cross-end final
        */
        div.container{
            background-color: aquamarine;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: coral;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
            
        }

        div#cxA{
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#cxB{
            flex-shrink: 1;
            flex-grow: 4;
        }

        div#cxC{
            flex-shrink: 1;
            flex-grow: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
    
</body>
</html>
