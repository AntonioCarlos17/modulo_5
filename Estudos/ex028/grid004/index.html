<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        div.container_1{
            font-family: Arial, Helvetica, sans-serif;
            border: 3px solid blue;
            display: grid;
            grid-template-rows: repeat(3, 80px);
            grid-template-columns: repeat(3, 150px);
            grid-auto-rows: 80px;
            grid-auto-flow: column;
            grid-auto-columns: 150px;
            gap: 5px;
            place-items: normal normal;
            place-content: normal normal;
        }

        div.item{
            border: 3px solid red;
            padding: 5px;
        }

        div.container_2{
            font-family: Arial, Helvetica, sans-serif;
            border: 3px solid blue;
            display: grid;
            grid-template-rows: repeat(3, 80px);
            grid-template-columns: 1fr 2fr 6fr;
            grid-auto-rows: 80px;
            grid-auto-flow: row;
            grid-auto-columns: 1fr;
            gap: 5px;
            place-items: normal normal;
            place-content: normal normal;
        }

        div.container_3{
            font-family: Arial, Helvetica, sans-serif;
            border: 3px solid blue;
            display: grid;
            grid-template-rows: repeat(3, 80px);
            grid-template-columns: 150px 35% repeat(2, 1fr);
            grid-auto-rows: 80px;
            grid-auto-flow: row;
            grid-auto-columns: 1fr;
            gap: 5px;
            place-items: normal normal;
            place-content: normal normal;
        }
    </style>
</head>
<body>
    <h1>Usando grid auto para linhas e colunas</h1>
    <div class="container_1">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>        
        <div class="item">I</div>
        <div class="item">JJ</div>
    </div>
    <h1> função repeat</h1>
    <div class="container_2">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>        
        <div class="item">I</div>
        <div class="item">JJ</div>
    </div>
    <h1>Usando três formas de dimenção diferente</h1>
    <div class="container_3">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>        
        <div class="item">I</div>
        <div class="item">JJ</div>
    </div>
</body>
</html>
