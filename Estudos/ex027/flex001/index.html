<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        /* 

        fex direction: row;
        main-axis é o eixo principal na horizontal
        main-start inicio
        main-end final

        cross-axis é o eixo principal na vertical
        cross-start inicio
        cross-end final
        */
        div.container{
            background-color: aquamarine;
            display: flex;
        }

        div.item{
            background-color: coral;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
    
</body>
</html>
